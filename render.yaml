# Render Blueprint — Dashboard > New > Blueprint > is repo ko chuno.
# "sync: false" wali values Render khud poochega (secrets).
services:
  - type: web
    name: ai-receptionist
    runtime: node
    # starter ($7): ~3-4 ek saath calls. Zyada concurrency => standard ($25).
    # Free plan NAHI: 15 min idle ke baad so jaata hai -> pehli call fail.
    plan: starter
    # Callers India me; Singapore sabse nazdeek Render region
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ---------- server ----------
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Asia/Kolkata
      - key: PORT
        value: 10000
      - key: BASE_URL # https://ai-receptionist.onrender.com (ya custom domain)
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DASHBOARD_API_KEY
        generateValue: true
      # ---------- database ----------
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ai_receptionist
      # ---------- Plivo ----------
      - key: PLIVO_AUTH_ID
        sync: false
      - key: PLIVO_AUTH_TOKEN
        sync: false
      - key: PLIVO_PHONE_NUMBER
        sync: false
      - key: PLIVO_SAMPLE_RATE
        value: "8000"
      - key: PLIVO_MACHINE_DETECTION
        value: "true"
      - key: HUMAN_HANDOFF
        value: "true"
      - key: HANDOFF_NUMBER # reception ka number, e.g. 917408412008
        sync: false
      # ---------- LLM (Groq -> Gemini fallback) ----------
      - key: LLM_PRIMARY
        value: groq
      - key: GROQ_API_KEY
        sync: false
      # gpt-oss-20b: sasta + prompt caching (cached input 50% off)
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_STREAM
        value: "true"
      # ---------- STT ----------
      - key: STT_PROVIDER
        value: groq
      - key: STT_MODEL
        value: whisper-large-v3-turbo
      # ---------- TTS (Sarvam -> Azure -> Edge) ----------
      - key: TTS_ENGINES
        value: sarvam,azure,elevenlabs,edge
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: bulbul:v3
      - key: SARVAM_SPEAKER
        value: priya
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: centralindia
      - key: AZURE_TTS_VOICE
        value: hi-IN-SwaraNeural
      # ---------- conversation / cost ----------
      - key: SLOT_CAPACITY
        value: "8"
      - key: MAX_CALL_SECONDS
        value: "420"
      - key: IDLE_REPROMPT_MS
        value: "7000"
